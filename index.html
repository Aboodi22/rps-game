<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPS — ABDELL ALWAYS WIN</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  :root {
    --navy: #0F2854;
    --blue-medium: #1C4D8D;
    --blue-light: #4988C4;
    --sky-pale: #BDE8F5;
    --white: #FFFFFF;
  }
  body {
    font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue-medium) 100%);
    color: var(--white);
    min-height: 100vh;
    padding: 24px;
  }
  .page-wrap {
    max-width: 1200px;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--sky-pale);
    margin-bottom: 8px;
    text-shadow: 0 0 20px rgba(189, 232, 245, 0.3);
  }
  .subtitle {
    color: var(--sky-pale);
    opacity: 0.85;
    font-size: 1.1rem;
    line-height: 1.6;
  }
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 4fr;
    gap: 24px;
    align-items: start;
  }
  .video-shell {
    position: relative;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 0 0 2px var(--blue-light),
      0 0 50px rgba(73, 136, 196, 0.3),
      inset 0 0 60px rgba(15, 40, 84, 0.6);
    background: var(--navy);
  }
  video, canvas {
    width: 100%;
    height: auto;
    display: block;
    transform: scaleX(-1);
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
  .status-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(189, 232, 245, 0.15);
    color: var(--sky-pale);
    padding: 8px 18px;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 600;
    border: 1px solid var(--sky-pale);
    z-index: 10;
  }
  .status-badge::before {
    content: '●';
    margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .cards-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .card {
    backdrop-filter: blur(12px);
    background: rgba(28, 77, 141, 0.6);
    border-radius: 16px;
    border: 2px solid var(--blue-light);
    box-shadow: 0 8px 32px rgba(15, 40, 84, 0.5);
    padding: 24px 20px;
    transition: all 0.4s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--sky-pale);
  }
  .card.you-card {
    border-left: 4px solid var(--sky-pale);
  }
  .card.ai-card {
    border-right: 4px solid var(--sky-pale);
    text-align: center;
  }
  .card.result-card {
    border-left: 4px solid var(--sky-pale);
    opacity: 0.4;
    transform: translateY(5px);
  }
  .card.result-card.visible {
    opacity: 1;
    transform: translateY(0);
    background: rgba(0, 120, 60, 0.4);
    border-color: #90ee90;
  }
  .label {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--sky-pale);
    margin-bottom: 10px;
    font-weight: 700;
    opacity: 0.9;
  }
  .value {
    font-size: 2rem;
    font-weight: 900;
    color: var(--white);
  }
  .value.waiting {
    color: var(--sky-pale);
    opacity: 0.5;
    font-size: 1.5rem;
    font-style: italic;
  }
  .instructions {
    margin-top: 32px;
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .instr-card {
    background: rgba(73, 136, 196, 0.25);
    border-radius: 12px;
    padding: 18px 28px;
    text-align: center;
    border: 2px solid var(--blue-light);
    min-width: 120px;
    transition: transform 0.3s ease;
  }
  .instr-card:hover {
    transform: translateY(-4px);
    border-color: var(--sky-pale);
  }
  .instr-emoji {
    font-size: 2.2rem;
    margin-bottom: 6px;
  }
  .instr-text {
    font-weight: 700;
    font-size: 1rem;
    color: var(--sky-pale);
  }
  @media (max-width: 900px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
    .cards-panel {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      min-width: 180px;
    }
  }
</style>
</head>
<body>
<div class="page-wrap">
  <header>
    <h1>ABDELL ALWAYS WINS ✊✋✌️</h1>
    <p class="subtitle">Show your hand to the camera → ABDELL instantly plays the winning move every time</p>
  </header>

  <div class="main-grid">
    <div class="video-shell">
      <div class="status-badge">LIVE</div>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div class="cards-panel">
      <div class="card you-card">
        <div class="label">Your Move</div>
        <div class="value waiting" id="yourMove">Waiting…</div>
      </div>

      <div class="card ai-card">
        <div class="label">ABDELL Plays</div>
        <div class="value waiting" id="aiMove">—</div>
      </div>

      <div class="card result-card" id="resultCard">
        <div class="label">Result</div>
        <div class="value" id="resultText" style="font-size: 1.3rem;"></div>
      </div>
    </div>
  </div>

  <div class="instructions">
    <div class="instr-card">
      <div class="instr-emoji">✊</div>
      <div class="instr-text">Rock</div>
    </div>
    <div class="instr-card">
      <div class="instr-emoji">✋</div>
      <div class="instr-text">Paper</div>
    </div>
    <div class="instr-card">
      <div class="instr-emoji">✌️</div>
      <div class="instr-text">Scissors</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const BEATS = { ROCK: 'PAPER', PAPER: 'SCISSORS', SCISSORS: 'ROCK' };

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const yourMoveEl = document.getElementById('yourMove');
const aiMoveEl = document.getElementById('aiMove');
const resultCard = document.getElementById('resultCard');
const resultText = document.getElementById('resultText');

let lastMove = '';
let stableStart = 0;
const STABLE_DELAY = 500;

function classifyGesture(landmarks) {
  const tip = [4, 8, 12, 16, 20];
  const pip = [3, 6, 10, 14, 18];
  const fingersUp = [];
  for (let i = 1; i < 5; i++) {
    fingersUp.push(landmarks[tip[i]].y < landmarks[pip[i]].y);
  }
  if (!fingersUp.some(f => f)) return 'ROCK';
  if (fingersUp.every(f => f)) return 'PAPER';
  if (fingersUp[0] && fingersUp[1] && !fingersUp[2] && !fingersUp[3]) return 'SCISSORS';
  return 'UNKNOWN';
}

async function init() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.6
  });
  hands.onResults(onResults);

  async function processFrame() {
    await hands.send({ image: video });
    requestAnimationFrame(processFrame);
  }
  processFrame();
}

function onResults(results) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  let yourMove = 'NO HAND';
  
  if (results.multiHandLandmarks) {
    for (const landmarks of results.multiHandLandmarks) {
      drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
        color: '#BDE8F5',
        lineWidth: 3
      });
      drawLandmarks(ctx, landmarks, {
        color: '#4988C4',
        lineWidth: 2,
        radius: 5
      });
      
      const gesture = classifyGesture(landmarks);
      if (gesture !== 'UNKNOWN') yourMove = gesture;
    }
  }

  if (yourMove !== lastMove) {
    lastMove = yourMove;
    stableStart = Date.now();
    resultCard.classList.remove('visible');
  } else if (Date.now() - stableStart > STABLE_DELAY && BEATS[yourMove]) {
    const aiMove = BEATS[yourMove];
    yourMoveEl.textContent = yourMove;
    yourMoveEl.classList.remove('waiting');
    aiMoveEl.textContent = aiMove;
    aiMoveEl.classList.remove('waiting');
    resultText.textContent = `${aiMove} beats ${yourMove} → ABDELL WINS!`;
    resultCard.classList.add('visible');
    return;
  }

  yourMoveEl.textContent = yourMove === 'NO HAND' ? 'Show your hand…' : yourMove;
  yourMoveEl.classList.toggle('waiting', yourMove === 'NO HAND');
  aiMoveEl.textContent = '—';
  aiMoveEl.classList.add('waiting');
}

function drawConnectors(ctx, landmarks, connections, opts) {
  ctx.strokeStyle = opts.color;
  ctx.lineWidth = opts.lineWidth;
  ctx.lineCap = 'round';
  for (const [a, b] of connections) {
    ctx.beginPath();
    ctx.moveTo(landmarks[a].x * canvas.width, landmarks[a].y * canvas.height);
    ctx.lineTo(landmarks[b].x * canvas.width, landmarks[b].y * canvas.height);
    ctx.stroke();
  }
}

function drawLandmarks(ctx, landmarks, opts) {
  ctx.fillStyle = opts.color;
  for (const lm of landmarks) {
    ctx.beginPath();
    ctx.arc(lm.x * canvas.width, lm.y * canvas.height, opts.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

init().catch(err => {
  alert('Camera access required! Please allow camera permissions. ' + err.message);
});
</script>
</body>
</html>
